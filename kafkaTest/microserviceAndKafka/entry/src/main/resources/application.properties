spring.datasource.url=jdbc:mysql://localhost:3306/testdb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}


# Spring Boot / Tomcat
#server.port=8083
#do not start tomcat
spring.main.web-application-type=none 

# Mercury REST automation
rest.server.port=8085
rest.automation=true

yaml.rest.automation=classpath:/rest.yaml
yaml.flow.automation=classpath:/flows.yaml

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


spring.boot.main=com.example.test.SpringBootApp
spring.component.scan=com.example.test
web.component.scan=com.example.test


spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
